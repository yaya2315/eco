name: Construir APK de Eco

# Se ejecuta cada vez que haces push con cambios en la app, o a mano desde la pestaña Actions.
# La laptop baja este APK sola y se lo ofrece al teléfono (sección 11 del README).
# Además queda en "Releases" del repositorio, para bajarlo directo desde el teléfono.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # para publicar el APK en Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Número de versión
        run: |
          echo "ECO_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ECO_VERSION_NAME=1.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Datos de la versión (los lee la laptop)
        run: |
          printf '{"versionCode": %s, "versionName": "%s", "commit": "%s"}\n' \
            "$ECO_VERSION_CODE" "$ECO_VERSION_NAME" "${GITHUB_SHA::7}" \
            > android/app/build/outputs/apk/debug/version.json
          cat android/app/build/outputs/apk/debug/version.json

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Eco-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/version.json
          retention-days: 30

      - name: Nombre del APK para Releases
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Eco-${ECO_VERSION_NAME}.apk"

      - name: Publicar en Releases (se baja directo en el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.ECO_VERSION_NAME }}
          name: Eco ${{ env.ECO_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: Eco-${{ env.ECO_VERSION_NAME }}.apk
          body: |
            ${{ github.event.head_commit.message }}

            **Para instalarla en el teléfono:** toca `Eco-${{ env.ECO_VERSION_NAME }}.apk` aquí abajo, ábrelo e instálala encima de la que tienes. No pierdes tus ajustes ni tus contactos.
