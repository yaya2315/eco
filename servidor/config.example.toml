# ─────────────────────────────────────────────────────────────
#  Eco · configuración del servidor
#  Copia este archivo como config.toml (instalar.bat lo hace solo)
#  y llena lo que te falte. config.toml NUNCA se sube a GitHub.
# ─────────────────────────────────────────────────────────────

[usuario]
nombre = "Leonardo"

[servidor]
puerto = 8765
# Una clave larga e inventada. Es la misma que escribes en la app del teléfono.
token = "cambia-esto-por-una-clave-larga"

[whisper]
# Con batería: tiny / base / small / medium. "small" es el equilibrio para tu Ryzen 5.
modelo = "small"
idioma = "es"
beam = 1        # 1 = rápido. 3-5 = un poco más preciso y más lento.
hilos = 0       # 0 = automático (enchufada usa todos los núcleos, con prioridad baja)
# Con la laptop enchufada usa el más preciso (se baja solo la primera vez, ~1.6 GB).
# "large-v3-turbo" es casi tan bueno como el más grande de Whisper y bastante más rápido.
# "" = usar siempre el de arriba.
modelo_preciso = "large-v3-turbo"
beam_preciso = 3
# Nombres o palabras raras que dices seguido (Eco ya usa tus clases y los nombres que anotó).
palabras = []   # por ejemplo ["Steven", "Market Conexión", "Tinkercad"]

[ia]
# "claude" (mejor calidad, necesita internet y una API key)
# "ollama" (todo en tu laptop, gratis, más lento y menos fino)
proveedor = "claude"
claude_modelo = "claude-haiku-5-5"
claude_api_key = ""             # o deja vacío y usa la variable de entorno ANTHROPIC_API_KEY
ollama_modelo = "qwen2.5:3b"
ollama_mejor = "qwen3.5:4b"     # si lo instalas (ollama pull qwen3.5:4b), Eco lo usa: entiende mucho mejor
ollama_vision = "qwen2.5vl:3b"  # lee las fotos que le mandas al bot (ollama pull qwen2.5vl:3b)
ollama_embed = "embeddinggemma" # entiende el significado al preguntarle a Eco (ollama pull embeddinggemma)
ollama_url = "http://localhost:11434"

[telegram]
# 1) Habla con @BotFather en Telegram → /newbot → copia el token aquí.
# 2) Enciende Eco, escríbele /start a tu bot y te responde con tu chat_id.
token = ""
chat_id = ""

[notas]
# Carpeta donde se escriben las notas. Puede ser una ruta de tu bóveda de Obsidian,
# por ejemplo: "C:/Users/Leonardo/Documents/Obsidian/Eco"
carpeta = "notas"
zona_horaria = "America/El_Salvador"
hora_resumen = "21:00"          # resumen del día por Telegram
hora_manana = "06:30"           # resumen de la mañana: hoy, exámenes y la semana ("" = apagado)
hora_recordatorio = "07:00"     # aviso para tareas con fecha pero sin hora
aviso_antes_min = 60            # para tareas con hora: cuántos minutos antes avisar
guardar_transcripcion = false   # false = solo se guardan las notas, no lo que dijo cada quien
guardar_audio = false           # false = el audio se borra apenas se transcribe

[sesiones]
# Modo clase (laptop) y modo reunión (teléfono): la transcripción completa se guarda para que
# puedas preguntarle a Eco después. Pon false si no quieres guardarla.
guardar_transcripcion_clase = true
guardar_transcripcion_reunion = true
clase_auto_terminar_min = 20    # la clase se termina sola tras este tiempo en silencio

[respaldo]
activo = true
carpeta = ""        # vacío = tu OneDrive\Eco respaldos
conservar = 14      # cuántas copias diarias guardar

[peligro]
# Si algo que guardaste suena a peligro, Eco te pregunta en el teléfono si quieres avisar a tus
# contactos de emergencia. Nunca les manda nada sin que lo confirmes (manteniendo presionado el botón).
activo = true
horas_vigente = 2         # después de esto la pregunta ya no aparece

[salud]
alertas = true            # avisos por Telegram cuando algo deja de funcionar
telefono_horas = 3        # avisar si el teléfono no se reporta en este tiempo
silencio = "22:00-06:30"  # de noche las alertas esperan a la mañana

[google]
# Se conecta desde el panel (README, sección 10). Aquí solo eliges qué usar.
anuncios = true     # leer los anuncios de Classroom y sacar fechas y tareas
classroom = true    # traer las tareas de Classroom
calendar = true     # poner tus pendientes con fecha en el calendario "Eco"
cada_min = 20       # cada cuánto revisar Classroom

[github]
# Para que la app del teléfono se actualice sola (README, sección 11).
# El token lo puedes pegar aquí o, mejor, en el panel (así no queda en este archivo).
token = ""
repo = "yaya2315/eco"

# Lugares con nombre (opcional). Así tus notas dicen "📍 Casa" en vez de coordenadas.
# Para sacar las coordenadas: mantén presionado el lugar en Google Maps y copia los números.
# [[lugares]]
# nombre = "Casa"
# lat = 13.7000
# lon = -89.2000
# radio_m = 150
#
# [[lugares]]
# nombre = "Colegio"
# lat = 13.7200
# lon = -89.7200
# radio_m = 200
